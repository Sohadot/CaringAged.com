name: Static quality gate
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static site and indexation scope
        run: python scripts/validate.py
